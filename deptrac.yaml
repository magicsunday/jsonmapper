# Deptrac configuration.
#
# The canonical layer definitions and the allowed-dependency ruleset are imported
# from magicsunday/coding-standard (^3.0: one strict, acyclic order
# Support < Enum < Model, Configuration < Contract < Repository, Adapter, Service
# < Facade < Module); this file declares the paths to analyse and this library's
# own layers. The import path follows this repository's `.build/vendor` layout.
#
# `composer ci:test:php:deptrac` runs `deptrac analyse`, then
# `deptrac debug:unassigned` (fails while a class is in no layer), and finally
# writes the layer graph with `--formatter=graphviz-dot` and checks it with
# `check-deptrac-cycles.php` (fails on any layer cycle). Dependencies on classes
# outside every layer (Symfony, PHP built-ins) are reported as "uncovered" but do
# not fail the run; do not enable `--fail-on-uncovered` wholesale, since every
# external dependency is uncovered.
imports:
    - .build/vendor/magicsunday/coding-standard/deptrac/layers.yaml

deptrac:
    paths:
        - src

    # Package-local layers: one per src/JsonMapper/<Area> namespace, plus the JsonMapper entry
    # class. Configuration is collected by the shared layer of the same name.
    layers:
        -
            name: Mapper
            collectors:
                -
                    type: classNameRegex
                    value: '#^MagicSunday\\JsonMapper$#'
        -
            name: Attribute
            collectors:
                -
                    type: directory
                    value: 'src/JsonMapper/Attribute/.*'
        -
            name: Collection
            collectors:
                -
                    type: directory
                    value: 'src/JsonMapper/Collection/.*'
        -
            name: Context
            collectors:
                -
                    type: directory
                    value: 'src/JsonMapper/Context/.*'
        -
            name: Converter
            collectors:
                -
                    type: directory
                    value: 'src/JsonMapper/Converter/.*'
        -
            name: Exception
            collectors:
                -
                    type: directory
                    value: 'src/JsonMapper/Exception/.*'
        -
            name: Metadata
            collectors:
                -
                    type: directory
                    value: 'src/JsonMapper/Metadata/.*'
        -
            name: Report
            collectors:
                -
                    type: directory
                    value: 'src/JsonMapper/Report/.*'
        -
            name: Resolver
            collectors:
                -
                    type: directory
                    value: 'src/JsonMapper/Resolver/.*'
        -
            name: Type
            collectors:
                -
                    type: directory
                    value: 'src/JsonMapper/Type/.*'
        -
            name: Value
            collectors:
                -
                    type: directory
                    value: 'src/JsonMapper/Value/.*'

    # Allow-lists: each area may depend only on the areas listed. They pin the current acyclic
    # graph; the entry class wires everything. Configuration's entry widens the shared layer's
    # list (Deptrac unites imported rulesets) by the MappingContext option keys it references.
    ruleset:
        Attribute: ~
        Exception: ~
        Converter: ~
        Type: ~
        Metadata:
            - Attribute
        Context:
            - Exception
        Configuration:
            - Context
        Report:
            - Context
        Resolver:
            - Context
        Collection:
            - Context
            - Exception
            - Resolver
        Value:
            - Collection
            - Context
            - Exception
            - Resolver
        Mapper:
            - Attribute
            - Collection
            - Configuration
            - Context
            - Converter
            - Exception
            - Metadata
            - Report
            - Resolver
            - Type
            - Value
